<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Convene</title>
  <meta name="theme-color" content="#4a1d96">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="dashboard" data-root="../">
  <div id="site-header"></div>

  <main class="container page">
    <div class="page-head" style="display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap">
      <div>
        <h1>Dashboard</h1>
        <p>Your registrations and the events you host.</p>
      </div>
      <a class="btn" href="../create/">Host an event</a>
    </div>

    <div class="stats" id="stats"></div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-registered" aria-selected="true">My registrations</button>
      <button class="tab" role="tab" id="tab-hosting" aria-selected="false">Hosting</button>
    </div>

    <section id="panel-registered"><div class="loading">Loading...</div></section>
    <section id="panel-hosting" hidden></section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
