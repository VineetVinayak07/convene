<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Convene</title>
  <meta name="theme-color" content="#4a1d96">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="profile" data-root="../">
  <div id="site-header"></div>

  <main class="container page">
    <div class="page-head">
      <h1>Your profile</h1>
      <p>This name is shown to organizers and on events you host.</p>
    </div>

    <form id="profile-form" class="card form-card" novalidate>
      <div id="profile-msg" hidden></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" disabled>
      </div>
      <div class="field">
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" maxlength="80" required>
      </div>
      <div class="field">
        <label for="bio">About you (optional)</label>
        <textarea id="bio" maxlength="300" style="min-height:100px"></textarea>
        <span class="hint">Up to 300 characters. Visible to anyone who views events you host.</span>
      </div>
      <div class="form-actions">
        <button class="btn" type="submit" id="save-btn">Save profile</button>
      </div>
    </form>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="profile.js"></script>
</body>
</html>
