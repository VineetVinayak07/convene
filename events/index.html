<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | Convene</title>
  <meta name="description" content="Browse and search upcoming events.">
  <meta name="theme-color" content="#4a1d96">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="events" data-root="../">
  <div id="site-header"></div>

  <main class="container page">
    <div class="page-head">
      <h1>Events</h1>
      <p>Find something to attend.</p>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search by title or location" aria-label="Search events" autocomplete="off">
      </div>
      <select id="category" aria-label="Category" style="width:auto;min-width:170px">
        <option value="">All categories</option>
      </select>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-upcoming" aria-selected="true">Upcoming</button>
      <button class="tab" role="tab" id="tab-past" aria-selected="false">Past</button>
    </div>

    <p class="muted small" id="result-count" style="margin-bottom:14px" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <div style="text-align:center;margin-top:28px">
      <button class="btn btn-outline" id="more" hidden>Show more</button>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="events.js"></script>
</body>
</html>
